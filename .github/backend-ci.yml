name: backend-ci

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,quality]"

      - name: Type check
        run: mypy src

      - name: Format check
        run: ruff format --check --diff src test

      - name: Lint
        run: ruff check src test

      - name: Security check
        run: bandit -c pyproject.toml -r src

      - name: Run tests
        run: pytest -q