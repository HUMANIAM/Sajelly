[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zorba-tools"
version = "0.1.0"
description = "Reusable engineering tools for the vendor-neutral Zorba team"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<8.4",
  "tomli>=2,<3; python_version < '3.11'",
]

[tool.setuptools]
py-modules = ["zorba_cli"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
